name: smartcloud
description: Repository automation and policy for GitHub, configured as code.
author: Resnovas
branding:
  icon: at-sign
  color: purple
inputs:
  GITHUB_TOKEN:
    description: The token smartcloud acts with. Settings, sync and private presets in other repositories need a stronger token than the workflow token; without one, smartcloud skips them and says so. Pull requests from forks and runs started by Dependabot always act with the workflow token.
    required: false
    default: ${{ github.token }}
  workflowToken:
    description: The workflow's own token. Leave it at its default. smartcloud compares GITHUB_TOKEN with it to tell a restricted run, acts with it on pull requests from forks and runs started by Dependabot, and reads the pull request's checks with it for the required feature, because it has checks and statuses read from the job's permissions.
    required: false
    default: ${{ github.token }}
  config:
    description: The config file. Defaults to the first of .github/smartcloud.yml, .github/smartcloud.yaml or .github/config.json.
    required: false
  configJson:
    description: The config given inline, as YAML or JSON. Wins over the file.
    required: false
  configRef:
    description: The branch, tag or commit to read the config from. Defaults to the default branch, so a pull request cannot change the rules it is checked against.
    required: false
  dryRun:
    description: Set to true to record every write in the job summary instead of making it.
    required: false
  features:
    description: A comma-separated list of the features to run. Defaults to every configured feature, as does a list with no names in it.
    required: false
  checkRunId:
    description: The job's check run id, from the job.check_run_id expression, so the required feature waits for the other checks and leaves this job's own check out. Without it, the required feature is skipped.
    required: false
  telemetry:
    description: Set to false to stop smartcloud sending anonymous telemetry to PostHog. On by default; turning it off is discouraged, because telemetry is how problems are found and fixed. See the telemetry page of the documentation for what is and is not collected.
    required: false
  fillEmpty:
    description: Deprecated and ignored; shared settings now come from `extends`.
    required: false
  skipDelete:
    description: Deprecated and ignored; labels are only deleted when `labelSync.prune` is true.
    required: false

runs:
  using: node24
  main: dist/index.js
