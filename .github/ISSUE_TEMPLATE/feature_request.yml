# house:managed:begin - synced from Resnovas/.github templates/.github/ISSUE_TEMPLATE/feature_request.yml. Edits inside this block are overwritten.
name: Feature request
description: Propose a new feature or an improvement. Keep it short.
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you. A few sentences.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional. Anything you tried or considered instead.

  - type: textarea
    id: duplicates
    attributes:
      label: Duplicate search
      description: What you searched for in open and closed issues, and any related issues you found.
    validations:
      required: true

  - type: dropdown
    id: ai-level
    attributes:
      label: AI level
      description: The highest level of AI involvement in this request. See the [AI Contribution Policy](https://github.com/Resnovas/smartcloud/blob/HEAD/AI_POLICY.md#levels).
      options:
        - none
        - autocomplete
        - chat
        - agent
        - autonomous
    validations:
      required: true

  - type: input
    id: ai-tools
    attributes:
      label: AI tools
      description: Every AI tool and model used, or none.
    validations:
      required: true
# house:managed:end
# house:local - add further fields below, as list items under body.
