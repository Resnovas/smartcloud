# house:managed:begin - synced from Resnovas/.github templates/.github/smartcloud.yml. Edits inside this block are overwritten.
# yaml-language-server: $schema=https://raw.githubusercontent.com/Resnovas/smartcloud/main/schema/smartcloud.schema.json
version: 2
extends:
  - Resnovas/.github/smartcloud/house.yml@main
# house:managed:end
# house:local - add this repository's own configuration below this line.
#
# Local additions are allowed: new labels and rules, and keys the house preset
# leaves unset, such as settings.environments.projectType or sync.exclude.
# A value the preset already sets cannot be changed here; restating it exactly
# is allowed, but any other value fails the run.

# smartcloud keeps its own LICENSE, first published in 2021, and runs itself
# from its default branch's build in .github/workflows/smartcloud.yml rather
# than from a release.
sync:
  exclude:
    - LICENSE
    - .github/workflows/smartcloud.yml

# smartcloud publishes the action and the @resnovas/smartcloud package.
settings:
  environments:
    projectType: library
  # The CI job gates merging alongside the preset's own checks. smartcloud
  # deploys no pre-production environment, uploads no ESLint results to code
  # scanning and no coverage to GitHub yet, so it adds no required
  # deployments, ESLint gate or coverage limits.
  ruleset:
    statusChecks:
      checks:
        check: true

# The aggregate check waits for smartcloud's CI job too, so a renamed or
# deleted CI job cannot let the aggregate pass with nothing to wait for.
required:
  expect:
    - ^check$
