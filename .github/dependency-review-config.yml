# house:managed:begin - synced from Resnovas/.github templates/.github/dependency-review-config.yml. Edits inside this block are overwritten.
#
# Dependency review policy, read by the house dependency review workflow
# (house-dependency-review.yml). The workflow sets the vulnerability severity
# and scopes itself; this file holds the licence policy.
#
# Every dependency a pull request adds must be under one of these licences:
# permissive ones that FCL-1.0-MIT, and the MIT licence it converts to, can
# ship alongside. Copyleft licences (GPL, AGPL, LGPL, EUPL, SSPL and the like)
# are left out, because they would bind the whole work. MPL-2.0 is file-level
# copyleft and allowed for unmodified dependencies. A dependency with a missing
# or unknown licence fails until a maintainer reviews it.
#
# A repository adds its own keys below the managed block, such as allow-ghsas
# for an advisory that does not apply, or allow-dependencies-licenses for one
# package a maintainer has cleared. It cannot redefine allow-licenses.
allow-licenses:
  - 0BSD
  - Apache-2.0
  - BlueOak-1.0.0
  - BSD-2-Clause
  - BSD-3-Clause
  - CC-BY-4.0
  - CC0-1.0
  - ISC
  - MIT
  - MIT-0
  - MPL-2.0
  - Python-2.0
  - Unlicense
  - Zlib
# house:managed:end
# house:local - add this repository's own policy below this line.
