# house:managed:begin - synced from Resnovas/.github templates/.github/workflows/house-graphify.yml. Edits inside this block are overwritten.
#
# Keeps the committed Graphify graph (graphify-out/graph.json) in step with the
# code. On pull requests it reports a stale graph without failing; on the
# default branch it opens a pull request with the rebuilt graph. Uses the same
# HOUSE_SYNC_APP_ID and HOUSE_SYNC_APP_PRIVATE_KEY secrets as the house sync.
name: House graphify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  house-graphify:
    uses: Resnovas/.github/.github/workflows/graphify.yml@main
    permissions:
      contents: read
    secrets:
      app-id: ${{ secrets.HOUSE_SYNC_APP_ID }}
      app-private-key: ${{ secrets.HOUSE_SYNC_APP_PRIVATE_KEY }}
# house:managed:end
