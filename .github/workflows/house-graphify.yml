# house:managed:begin - synced from Resnovas/.github templates/.github/workflows/house-graphify.yml. Edits inside this block are overwritten.
#
# Keeps the committed Graphify graph (graphify-out/graph.json) in step with the
# code. On pull requests it reports a stale graph without failing; on the
# default branch it opens a pull request with the rebuilt graph, with a
# Resnovas Bot GitHub App token minted from the organisation variable
# RESNOVAS_BOT_APP_ID and secret RESNOVAS_BOT_PRIVATE_KEY, like the house sync.
# Pull requests, whose code the check runs, never receive the key.
name: House graphify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  house-graphify:
    uses: Resnovas/.github/.github/workflows/graphify.yml@main
    # The ceiling for the called jobs: its check job stays read-only, and the
    # refresh job needs write access when it falls back to the workflow token.
    permissions:
      contents: write
      pull-requests: write
    with:
      app-id: ${{ vars.RESNOVAS_BOT_APP_ID }}
    secrets:
      private-key: ${{ github.event_name != 'pull_request' && secrets.RESNOVAS_BOT_PRIVATE_KEY || '' }}
# house:managed:end
