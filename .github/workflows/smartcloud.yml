# smartcloud runs on its own repository from its own build, bundled from the
# default branch rather than a release. The config is read from the default
# branch too, so a pull request cannot loosen its own rules. The CI workflow
# tests a pull request's code; this one never runs it.
#
# The job acts with a Resnovas Bot GitHub App token (org variable
# RESNOVAS_BOT_APP_ID, org secret RESNOVAS_BOT_PRIVATE_KEY), because the config
# extends the house preset in the private Resnovas/.github repository, which
# the workflow token cannot read. The token reaches only this repository and
# Resnovas/.github, and GitHub signs the commits made with it. Building from
# the default branch keeps it away from pull request code. Pull requests from
# forks and Dependabot get no secrets, so no token is minted: they fall back
# to the read-only workflow token, and smartcloud then runs restricted,
# skipping the private preset, settings, sync and refused writes rather than
# failing.
name: smartcloud

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

concurrency:
  group: smartcloud-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  smartcloud:
    name: smartcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A scheduled run has no repository in its payload; it runs on the default branch anyway.
          ref: ${{ github.event.repository.default_branch || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Lifecycle scripts never run with the job token.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Bundle the action
        run: pnpm nx run @resnovas/action:bundle

      # Minted after the build, so no lifecycle script ever sees it. A failed
      # mint falls back to the workflow token rather than failing the run.
      - name: Mint the Resnovas Bot token
        id: app
        if: github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # GitHub accepts the App ID wherever the client ID is asked for.
          client-id: ${{ vars.RESNOVAS_BOT_APP_ID }}
          private-key: ${{ secrets.RESNOVAS_BOT_PRIVATE_KEY }}
          owner: Resnovas
          repositories: smartcloud,.github

      - name: Run smartcloud
        uses: ./
        with:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
