# smartcloud runs on its own repository from the local checkout, so every
# pull request is checked by the code it changes. The config is read from the
# default branch, so a pull request cannot loosen its own rules.
#
# The job runs the pull request's code with the ACCESS_TOKEN organisation
# secret, because the config extends the house preset in the private
# Resnovas/.github repository, which the workflow token cannot read. Only
# people who can already push a branch here, and so could change this
# workflow, reach that token: pull requests from forks get no secrets and fall
# back to the read-only workflow token.
name: smartcloud

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

concurrency:
  group: smartcloud-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  smartcloud:
    name: smartcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Lifecycle scripts from the pull request never run with the job token.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Bundle the action
        run: pnpm nx run @resnovas/action:bundle

      - name: Run smartcloud
        uses: ./
        with:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
