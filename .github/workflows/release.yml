# Releases with release-please. Conventional commits on main drive the
# version and changelog in a release pull request. The action bundle is
# built into that pull request, so dist/ only ever reaches main through a
# release. Once the release is tagged, the v<major> tag moves to it and the
# CLI is published to npm with provenance, through trusted publishing.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      sha: ${{ steps.release.outputs.sha }}
      pr_branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Keeps the bundle in the release pull request in step with main.
  bundle:
    needs: release-please
    if: needs.release-please.outputs.pr_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run action:bundle

      - name: Commit the bundle
        run: |
          git add --force dist/index.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --signoff --message 'chore(release): bundle the action'
          git push

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Move the major tag
        run: |
          git tag --force "v${{ needs.release-please.outputs.major }}" "${{ needs.release-please.outputs.sha }}"
          git push --force origin "v${{ needs.release-please.outputs.major }}"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run smartcloud:bundle

      - run: node tools/release/prepare-cli.ts

      - name: Publish the CLI
        working-directory: apps/cli/release
        run: npm publish --provenance --access public
