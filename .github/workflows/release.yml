# Releases with Nx release, started by hand from the Actions tab.
#
# Conventional commits since the last v* tag decide the version; the tag, not a
# file on main, holds the current version. tools/release/release.ts bumps the
# apps' versions, bundles the action from main's source into dist/index.js,
# commits both in a release commit on no branch (without externals/), and
# pushes only the v<version> tag, so main never holds a release commit or the
# bundle and no branch protection is bypassed. It then writes the release notes
# to a draft GitHub release and moves the v<major> tag.
#
# Nx writes the same notes to CHANGELOG.md and each app's CHANGELOG.md. They
# reach main through a pull request, since main takes changes only through
# pull requests and the merge queue: the changelogs job commits them through
# the GitHub API as the Resnovas Bot app, so the commit is signed by GitHub,
# and opens "chore(release): changelogs for v<version>". The app's token is
# minted only in that job, which checks out and runs none of the repository's
# code or dependencies; the release job hands it the files as an artifact.
#
# The publish job checks out the tag, refuses to go on unless the tagged bundle
# is what that tag's source builds, then publishes the CLI and MCP server to npm
# with provenance, through trusted publishing. The attest job then signs build
# provenance for the checked dist/index.js and attaches an SPDX SBOM of each app
# to the draft release, through the house attest.yml workflow, and the
# publish-release job publishes it. The release stays a draft until then because
# immutable releases lock a published release's assets.
#
# Every bundle's source map is uploaded to PostHog error tracking for the
# release and then deleted, so neither the tag nor npm ships one. The upload
# uses the POSTHOG_CLI_API_KEY organization secret, pinned to the Smartcloud
# project by tools/release/sourcemaps.ts; see docs/releasing.mdx.
#
# The first release (2.0.0) has no v* tag to count from: run it with specifier
# 2.0.0 and first-release ticked. See docs/releasing.mdx.
name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print the version and release notes without tagging, releasing or publishing
        type: boolean
        default: true
      specifier:
        description: Override the conventional commits, with a version (2.0.0) or a bump (major, minor, patch)
        type: string
        required: false
      first-release:
        description: No v* tag exists yet (the first v2 release only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Releases come only from main.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      base: ${{ steps.release.outputs.base }}
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # The changelogs job needs the app, so a real release stops before it tags anything without it.
      - name: Check the Resnovas Bot app is configured
        if: ${{ !inputs.dry-run }}
        env:
          HAS_APP: ${{ vars.RESNOVAS_BOT_APP_ID != '' && secrets.RESNOVAS_BOT_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_APP" != 'true' ]; then
            echo '::error::set the RESNOVAS_BOT_APP_ID variable and the RESNOVAS_BOT_PRIVATE_KEY secret; see docs/releasing.mdx'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Nx reads the conventional commits and v* tags from the full history.
          fetch-depth: 0
          fetch-tags: true
          # Nx pushes the release commit and tag with git.
          persist-credentials: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Version, tag and create the GitHub release
        id: release
        env:
          # Nx's GitHub client, which the release notes are rendered with, uses this token.
          GITHUB_TOKEN: ${{ github.token }}
          # A PostHog personal API key (error tracking write, organization read)
          # for uploading the action's source map; unused in a dry run.
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          DRY_RUN: ${{ inputs.dry-run }}
          SPECIFIER: ${{ inputs.specifier }}
          FIRST_RELEASE: ${{ inputs.first-release }}
        run: |
          args=()
          if [ "$DRY_RUN" = 'true' ]; then args+=(--dry-run); fi
          if [ "$FIRST_RELEASE" = 'true' ]; then args+=(--first-release); fi
          if [ -n "$SPECIFIER" ]; then args+=(--specifier "$SPECIFIER"); fi
          node tools/release/release.ts "${args[@]}"

      - name: Keep the changelog files for the changelogs job
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelogs
          path: |
            CHANGELOG.md
            apps/*/CHANGELOG.md
          if-no-files-found: error
          retention-days: 7

      - name: Keep the release notes for the draft-release job
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ steps.release.outputs.notes }}
          if-no-files-found: error
          retention-days: 7

  # Creates the GitHub release, as a draft, from the notes release.ts wrote.
  # A separate job, so a failed GitHub request is retried by re-running it
  # alone: the tag is already pushed, and the release job cannot run twice.
  # It reuses a release a previous attempt created.
  draft-release:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::unexpected version: $VERSION"; exit 1; }
          [ "$TAG" = "v$VERSION" ] || { echo "::error::unexpected tag: $TAG"; exit 1; }
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          id=${id%%$'\n'*}
          if [ -z "$id" ]; then
            prerelease=false
            if [[ "$VERSION" == *-* ]]; then prerelease=true; fi
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --field tag_name="$TAG" --field name="$TAG" \
              --field body=@release-notes.md --field draft=true --field prerelease="$prerelease" --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  changelogs:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    # Every write goes through the app's token.
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changelogs
          path: changelogs

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.RESNOVAS_BOT_APP_ID }}
          private-key: ${{ secrets.RESNOVAS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # A commit made through the API with an app token is signed by GitHub, so
      # it passes a signed-commits rule. Its author is the app's bot account,
      # which signs it off for the DCO check. It branches from the main commit
      # the release was cut from, so if main has changed the changelogs since,
      # the pull request shows a conflict rather than dropping those changes.
      - name: Open the changelog pull request
        working-directory: changelogs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          BASE: ${{ needs.release.outputs.base }}
        run: |
          set -euo pipefail
          # The outputs come from the job that ran repository code, so check
          # them before this token acts on them: a version, and a commit on main.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::unexpected version: $VERSION"; exit 1; }
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected base commit: $BASE"; exit 1; }
          case "$(gh api "repos/$REPO/compare/$BASE...main" --jq .status)" in
            ahead | identical) ;;
            *) echo "::error::$BASE is not on main"; exit 1 ;;
          esac
          branch="release/changelogs-v$VERSION"
          title="chore(release): changelogs for v$VERSION"
          base_tree=$(gh api "repos/$REPO/git/commits/$BASE" --jq .tree.sha)

          # Only the known changelog paths, whatever else the artifact holds.
          tree='[]'
          for file in CHANGELOG.md apps/action/CHANGELOG.md apps/cli/CHANGELOG.md apps/mcp/CHANGELOG.md; do
            [ -f "$file" ] || continue
            blob=$(base64 --wrap=0 "$file" | jq --raw-input '{content: ., encoding: "base64"}' |
              gh api "repos/$REPO/git/blobs" --input - --jq .sha)
            tree=$(jq --arg path "$file" --arg sha "$blob" '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]' <<<"$tree")
          done
          tree=$(jq --arg base "$base_tree" '{base_tree: $base, tree: .}' <<<"$tree" |
            gh api "repos/$REPO/git/trees" --input - --jq .sha)

          user_id=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          message=$(printf '%s\n\nSigned-off-by: %s[bot] <%s+%s[bot]@users.noreply.github.com>' "$title" "$APP_SLUG" "$user_id" "$APP_SLUG")
          commit=$(jq --null-input --arg message "$message" --arg tree "$tree" --arg parent "$BASE" \
            '{message: $message, tree: $tree, parents: [$parent]}' |
            gh api "repos/$REPO/git/commits" --input - --jq .sha)

          # A rerun finds the branch and pull request from the first attempt:
          # point the branch at the new commit and keep the open pull request.
          if gh api "repos/$REPO/git/ref/heads/$branch" --silent 2>/dev/null; then
            gh api --method PATCH "repos/$REPO/git/refs/heads/$branch" --field sha="$commit" --field force=true --silent
          else
            gh api "repos/$REPO/git/refs" --field ref="refs/heads/$branch" --field sha="$commit" --silent
          fi
          if [ "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq length)" -gt 0 ]; then
            exit 0
          fi
          gh pr create --repo "$REPO" --base main --head "$branch" --title "$title" --body "$(cat <<EOF
          The workspace and app changelogs for [v$VERSION](https://github.com/$REPO/releases/tag/v$VERSION), written by the release workflow. The GitHub release holds the same notes.

          Merge it before the next release, which builds on these files.
          EOF
          )"

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No registry-url: it writes an auth token that would stop npm using
      # trusted publishing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tagged bundle carries PostHog's chunk id, which is derived from its
      # content, so the rebuild goes through the same source map step before
      # it is compared.
      - name: Check the tagged bundle is the released code
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          test -f dist/index.js || { echo '::error::the release has no dist/index.js'; exit 1; }
          cp dist/index.js "$RUNNER_TEMP/tagged.js"
          pnpm nx run @resnovas/action:bundle --skip-nx-cache
          node tools/release/sourcemaps.ts "$VERSION" dist/index.js
          cmp dist/index.js "$RUNNER_TEMP/tagged.js" || { echo '::error::dist/index.js in the release does not match its source'; exit 1; }

      # One SPDX SBOM per shipped app, of its production dependencies, including
      # the workspace libraries bundled into it. The attest job signs
      # provenance for the checked bundle, binds the action's SBOM to it and
      # attaches every SBOM to the GitHub release.
      - name: Stage the bundle and its SBOMs for attestation
        env:
          STAGE: ${{ runner.temp }}/release-files
        run: |
          mkdir -p "$STAGE/dist"
          cp dist/index.js "$STAGE/dist/index.js"
          pnpm --filter @resnovas/action --filter @resnovas/smartcloud --filter @resnovas/smartcloud-mcp \
            sbom --sbom-format spdx --sbom-type application --prod --lockfile-only --split --out "$STAGE/%s-%v.spdx.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files
          if-no-files-found: error

      # The tag's package.json files carry the released version, which the bundles stamp as VERSION.
      - run: pnpm nx run-many -t bundle -p @resnovas/smartcloud @resnovas/smartcloud-mcp --skip-nx-cache

      # Upload the CLI and MCP server's source maps to PostHog and drop them, so npm ships the bundles only.
      - name: Upload the source maps
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
        run: node tools/release/sourcemaps.ts "$VERSION" apps/cli/release/smartcloud.js apps/cli/release/smartcloud-mcp.js

      - run: node tools/release/prepare-cli.ts

      # Trusted publishing needs npm 11.5 or later, newer than the runner's.
      - run: npm install --global npm@latest # zizmor: ignore[adhoc-packages]

      - name: Publish the CLI
        working-directory: apps/cli/release
        run: npm publish --provenance --access public

  # Signs build provenance for the released dist/index.js, binds its SBOM to it
  # and attaches the SBOMs to the GitHub release, through the house workflow.
  attest:
    needs: [release, draft-release, publish]
    uses: Resnovas/.github/.github/workflows/attest.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      artifact: release-files
      subject-path: dist/index.js
      sbom-path: resnovas-action-${{ needs.release.outputs.version }}.spdx.json
      release: ${{ needs.release.outputs.tag }}
      release-assets: '*.spdx.json'

  # Publishes the draft release once its SBOMs are attached; a published
  # release takes no new assets.
  publish-release:
    needs: [draft-release, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft-release.outputs.id }}
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || { echo "::error::unexpected release id: $RELEASE_ID"; exit 1; }
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --field draft=false --field make_latest=legacy --silent
