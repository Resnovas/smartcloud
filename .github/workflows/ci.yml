# CI for the v2 workspace: lint, typecheck, test with coverage, and build the
# projects a change affects, plus the licence header check and the check that
# docs/reference/configuration.mdx matches the JSON Schema.
name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Lint, typecheck, test and build affected projects
        run: pnpm nx affected -t lint typecheck test build

      - name: Type-check the tests
        run: pnpm typecheck:tests

      - name: Licence headers
        run: pnpm headers

      - name: Configuration reference is up to date
        run: pnpm docs:reference:check
