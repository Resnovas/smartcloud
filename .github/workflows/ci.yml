# CI for the v2 workspace: lint, typecheck, test with coverage, build, and
# check the API docs and contracts of the projects a change affects, plus the licence header check, the Prettier check
# and the check that docs/reference/configuration.mdx matches the JSON Schema.
name: CI

on:
  pull_request:
  # The default branch merges through a merge queue, which needs the required
  # "check" context on every queued group.
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]

# Each job asks for the access it needs; the workflow grants none.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nx keys each task by the hash of its inputs, so a restored entry is
      # replayed only when nothing it depends on changed. Every run saves a new
      # entry under its commit and workflow, and restores the latest earlier
      # one, which may come from the smartcloud workflow. A pull request's
      # entries are scoped to its own ref, so they never reach main.
      - name: Restore the Nx cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-ci
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Lint, typecheck, test and build affected projects
        run: pnpm nx affected -t lint typecheck test build

      # docgen type-checks every @example and fails on an export without a
      # description; contracts checks the built declarations for @example,
      # @param and @returns. The examples themselves run as doctests in `test`.
      - name: API docs and contracts of affected projects
        run: pnpm nx affected -t docgen contracts

      - name: Type-check the tests
        run: pnpm typecheck:tests

      - name: Licence headers
        run: pnpm headers

      - name: Formatting
        run: pnpm run format:check

      - name: Configuration reference is up to date
        run: pnpm docs:reference:check
