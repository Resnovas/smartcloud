# CI for the v2 workspace. Five jobs run in parallel on the projects a change
# affects: lint (with the licence header and Prettier checks), typecheck (with
# the test projects), test with coverage, build, and docs (API docs, contracts
# and the check that docs/reference/configuration.mdx matches the JSON Schema).
# The changes job first works out which of the last four the change needs
# (tools/ci/changes.ts), so a documentation-only pull request runs only lint and
# docs. The check job waits for all of them and is the one context the ruleset
# and the merge queue require, so adding or renaming a job never touches the
# ruleset.
name: CI

on:
  pull_request:
  # The default branch merges through a merge queue, which needs the required
  # "check" context on every queued group.
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]

# Each job asks for the access it needs; the workflow grants none.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the changed files with the committed Graphify graph and the Nx
  # project graph: documents need only lint and docs, project files need the
  # jobs whose targets Nx finds affected, and anything else (workflows, root
  # configuration, tools/) needs every job. Pushes to main and manual runs
  # always run every job.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      typecheck: ${{ steps.classify.outputs.typecheck }}
      test: ${{ steps.classify.outputs.test }}
      build: ${{ steps.classify.outputs.build }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nx compares a pull request with its merge base, and a push with the last
      # commit on main whose CI passed. A merge queue group is compared with the
      # commit it lands on, so it checks every queued pull request ahead of it
      # as well as its own, whichever grouping the queue uses.
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        if: github.event_name != 'merge_group'

      - name: Compare the merge queue group with its base
        if: github.event_name == 'merge_group'
        env:
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          echo "NX_BASE=$GROUP_BASE" >> "$GITHUB_ENV"
          echo "NX_HEAD=$GROUP_HEAD" >> "$GITHUB_ENV"

      - name: Classify the change
        id: classify
        run: node tools/ci/changes.ts "$NX_BASE" "$NX_HEAD"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nx keys each task by the hash of its inputs, so a restored entry is
      # replayed only when nothing it depends on changed. Every job saves a new
      # entry under its commit, workflow and job, and restores the latest
      # earlier one, which may come from another job or the smartcloud
      # workflow. A pull request's entries are scoped to its own ref, so they
      # never reach main.
      - name: Restore the Nx cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-ci-lint
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      # Picks the commits to compare as in the changes job.
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        if: github.event_name != 'merge_group'

      - name: Compare the merge queue group with its base
        if: github.event_name == 'merge_group'
        env:
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          echo "NX_BASE=$GROUP_BASE" >> "$GITHUB_ENV"
          echo "NX_HEAD=$GROUP_HEAD" >> "$GITHUB_ENV"

      - name: Lint affected projects
        run: pnpm nx affected -t lint

      - name: Licence headers
        run: pnpm headers

      - name: Formatting
        run: pnpm run format:check

  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Restores and saves the Nx cache as in the lint job.
      - name: Restore the Nx cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-ci-typecheck
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      # Picks the commits to compare as in the changes job.
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        if: github.event_name != 'merge_group'

      - name: Compare the merge queue group with its base
        if: github.event_name == 'merge_group'
        env:
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          echo "NX_BASE=$GROUP_BASE" >> "$GITHUB_ENV"
          echo "NX_HEAD=$GROUP_HEAD" >> "$GITHUB_ENV"

      - name: Type-check affected projects
        run: pnpm nx affected -t typecheck

      - name: Type-check the tests
        run: pnpm typecheck:tests

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Restores and saves the Nx cache as in the lint job.
      - name: Restore the Nx cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-ci-test
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      # Picks the commits to compare as in the changes job.
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        if: github.event_name != 'merge_group'

      - name: Compare the merge queue group with its base
        if: github.event_name == 'merge_group'
        env:
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          echo "NX_BASE=$GROUP_BASE" >> "$GITHUB_ENV"
          echo "NX_HEAD=$GROUP_HEAD" >> "$GITHUB_ENV"

      - name: Test affected projects
        run: pnpm nx affected -t test

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Restores and saves the Nx cache as in the lint job.
      - name: Restore the Nx cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-ci-build
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      # Picks the commits to compare as in the changes job.
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        if: github.event_name != 'merge_group'

      - name: Compare the merge queue group with its base
        if: github.event_name == 'merge_group'
        env:
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          echo "NX_BASE=$GROUP_BASE" >> "$GITHUB_ENV"
          echo "NX_HEAD=$GROUP_HEAD" >> "$GITHUB_ENV"

      - name: Build affected projects
        run: pnpm nx affected -t build

      - name: Check the action bundle size
        run: pnpm bundle:check

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Restores and saves the Nx cache as in the lint job.
      - name: Restore the Nx cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-ci-docs
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      # Picks the commits to compare as in the changes job.
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        if: github.event_name != 'merge_group'

      - name: Compare the merge queue group with its base
        if: github.event_name == 'merge_group'
        env:
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          echo "NX_BASE=$GROUP_BASE" >> "$GITHUB_ENV"
          echo "NX_HEAD=$GROUP_HEAD" >> "$GITHUB_ENV"

      # docgen type-checks every @example and fails on an export without a
      # description; contracts checks the built declarations for @example,
      # @param and @returns. The examples themselves run as doctests in `test`.
      - name: API docs and contracts of affected projects
        run: pnpm nx affected -t docgen contracts

      - name: Configuration reference is up to date
        run: pnpm docs:reference:check

  # The required context. It runs even when a job above fails or is cancelled,
  # and passes only when every job succeeded or was skipped because the changes
  # job found the change does not need it. A job skipped for any other reason,
  # such as a failed changes job, fails the check, so it can never let a pull
  # request through.
  check:
    name: check
    needs: [changes, lint, typecheck, test, build, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r '
            .changes.outputs as $needed
            | to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped" or ($needed[.key] // "") != "false")
            | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::Not every CI job passed:"
            echo "$failed"
            exit 1
          fi
          echo "Every job the change needs passed."
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
