# Synced from Resnovas/.github. Call this workflow after adopting docs/house-funnel.md.
# It does not replace repository-specific trusted-event or native verification jobs.
name: House funnel

on:
  workflow_call:
    inputs:
      install-command:
        description: Reviewed dependency installation command; never pass event text or secrets
        type: string
        default: npm ci --ignore-scripts
      node-version:
        type: string
        default: '24'

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FUNNEL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - name: Require an unprivileged event
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            pull_request|push|merge_group|workflow_dispatch) ;;
            *) echo 'Run candidate code only from an unprivileged event, never pull_request_target.' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install reviewed dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -e -o pipefail -c "$INSTALL_COMMAND"
      - name: Static checks before behavior and documentation
        id: static
        run: node --run verify:static
      - name: Existing complete verification
        run: node --run verify
      - name: Collect affected synthetic feature evidence
        id: evidence
        if: ${{ !cancelled() && steps.static.outcome == 'success' }}
        run: node --run verify:evidence
      - name: Validate evidence for publication
        id: publish
        if: ${{ !cancelled() && steps.evidence.outcome != 'skipped' }}
        run: node --run verify:evidence:check
      - name: Upload reviewed affected-feature evidence
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && hashFiles('.verification/publish/manifest.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: affected-feature-evidence
          path: .verification/publish/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
